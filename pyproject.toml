[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarwow-calibration"
version = "0.0.1"
description = "radar-wow stage 1: Calibration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["radarwow-core @ git+https://github.com/manmeet3591/radarwow-core", "radarwow-estimation @ git+https://github.com/manmeet3591/radarwow-estimation", "numpy", "scipy", "xarray"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
